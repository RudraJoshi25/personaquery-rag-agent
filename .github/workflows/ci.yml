name: CI

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    env:
      LOG_TO_STDOUT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      # Retrieval-only gate: no LLM, no secrets. Fails the build if
      # retrieval hit-rate@8 regresses below the threshold.
      - name: Eval gate (retrieval hit-rate@8 >= 90%)
        env:
          EVAL_HITRATE_GATE: "0.90"
        run: python -m src.eval.gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend-next/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
