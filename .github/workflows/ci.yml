name: CI

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    env:
      LOG_TO_STDOUT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build vector store (migrate chunks + vectors into Chroma)
        run: python -m scripts.migrate_to_chroma

      - name: Run test suite
        run: python -m pytest tests/ -q

      # Retrieval-only gate: no LLM, no secrets. Fails the build if
      # retrieval hit-rate@8 regresses below the threshold (measured 100%).
      - name: Eval gate (retrieval hit-rate@8 >= 90%)
        env:
          EVAL_HITRATE_GATE: "0.90"
        run: python -m src.eval.gate
